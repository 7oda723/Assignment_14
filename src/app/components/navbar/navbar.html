<div class="bg-[#0a0a0a] py-3 px-1 sticky top-0 z-20 transition duration-300 border-b-[1px] border-white/10" [class]="{'bg-black': scrollB,'border-[#e4e4e41f]':scrollB }"  [class.bg-[#101010]]="!scrollB">

     <div class="container flex flex-row-reverse justify-between items-center m-auto ">
        <div>
            <i class="fa-solid fa-bars text-[1.3rem]" style="display: none; color: #e4e4e4;"></i>
            <button class="hidden md:block bg-[#ff6900] text-white text-[1rem] font-medium px-7 py-2.5 rounded-3xl cursor-pointer" routerLink="/blog">ابدأ القراءة</button>
        </div>
        <nav class="hidden md:block ">
            <ul class="flex gap-1 text-[#a1a1a1] border-[1px] border-[#272727] rounded-3xl px-1 py-3 bg-[#161616]">
                <li><a class="rounded-3xl px-5 py-2.5 hover:text-white transition-all duration-300" routerLink="/home" routerLinkActive="bg-[#ff6900] text-white" >الرئيسية</a></li>
                <li><a class="rounded-3xl px-5 py-2.5 hover:text-white transition-all duration-300" routerLink="/blog" routerLinkActive="bg-[#ff6900] text-white" > المدونة</a></li>
                <li><a class="rounded-3xl px-5 py-2.5 hover:text-white transition-all duration-300" routerLink="/arewe" routerLinkActive="bg-[#ff6900] text-white"  [class.bg-[#ff6900]]="activeIndex === 2" [class.text-white]="activeIndex === 2">من نحن</a></li>
                
            </ul>
        </nav>
        <div class="flex items-center gap-2 cursor-pointer" routerLink="/home">
            <!-- <i class="fa-solid fa-camera-retro text-4xl" style="color: #ff6900"></i> -->
            <div class="w-14">
                <img src="/img/logo-GdqARQRt.png" alt="" class="w-full">
            </div>
            <div>
                <h1 class="text-right text-white text-[1.2rem] font-medium mb-0">عدسة</h1>
                <p class="hidden md:block text-[#ff8a04b1] mb-2 text-[0.8rem]">عالم التصوير الفوتوغرافي</p>
            </div>

    </div>  
     
</div>
